<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Watch OS - Arquivos</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #007BFF;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #333333;
            --hover: #2a2a2a;
        }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
        }
        .header {
            background-color: var(--surface); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .header h2 { margin: 0; font-size: 1.2rem; }
        .toolbar {
            padding: 15px 20px; display: flex; gap: 10px; align-items: center;
        }
        button {
            background-color: var(--primary); color: white;
            border: none; padding: 8px 15px; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-secondary { background-color: var(--surface); border: 1px solid var(--border); }
        .path-display { font-family: monospace; color: var(--text-muted); flex-grow: 1; }
        
        /* Tabela de Arquivos */
        .file-list { width: 100%; border-collapse: collapse; }
        .file-list th, .file-list td {
            text-align: left; padding: 12px 20px; border-bottom: 1px solid var(--border);
        }
        .file-list tr:hover { background-color: var(--hover); }
        .icon { font-size: 1.2rem; margin-right: 10px; }
        .action-btn { background: none; border: none; padding: 5px; cursor: pointer; font-size: 1.1rem; }
        
        /* Drag and Drop Zone */
        #drop-zone {
            border: 2px dashed var(--border); border-radius: 10px;
            margin: 0 20px; padding: 40px; text-align: center;
            color: var(--text-muted); transition: 0.3s;
            display: none; /* Só aparece quando arrasta */
        }
        #drop-zone.dragover { border-color: var(--primary); background-color: rgba(0, 123, 255, 0.1); color: var(--primary); }
        
        /* Modal e Progresso */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface); padding: 20px; border-radius: 10px; width: 300px; text-align: center;
        }
        .progress-bar {
            width: 100%; background: var(--border); height: 10px; border-radius: 5px; margin-top: 15px; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

    <div class="header">
        <h2>⌚ WatchOS File Manager</h2>
        <div>ESP32-S3 SD Card</div>
    </div>

    <div class="toolbar">
        <button onclick="document.getElementById('file-input').click()">☁️ Enviar Arquivo</button>
        <input type="file" id="file-input" style="display: none;" multiple onchange="handleFiles(this.files)">
        <button class="btn-secondary" onclick="createFolder()">📁 Nova Pasta</button>
        <button class="btn-secondary" onclick="loadFiles(currentPath)">🔄 Atualizar</button>
        <span class="path-display" id="current-path">/sdcard</span>
    </div>

    <div id="drop-zone">Solte os arquivos aqui para enviar para o relógio</div>

    <table class="file-list" id="table-files">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tamanho</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="file-body">
            <!-- Linhas injetadas pelo JS -->
        </tbody>
    </table>

    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <h3 id="upload-title">Enviando...</h3>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <p id="upload-status">0%</p>
        </div>
    </div>

    <script>
        let currentPath = "/sdcard";

        // Simulação da chamada da API (o C++ vai responder isso depois)
        async function loadFiles(path) {
            currentPath = path;
            document.getElementById('current-path').innerText = path;
            const tbody = document.getElementById('file-body');
            tbody.innerHTML = "<tr><td colspan='3'>Carregando...</td></tr>";

            try {
                // A requisição que faremos para o ESP32
                const response = await fetch(`/api/list?dir=${encodeURIComponent(path)}`);
                const files = await response.json();
                
                tbody.innerHTML = "";
                
                // Botão de voltar pasta
                if (path !== "/sdcard" && path !== "/") {
                    const parentDir = path.substring(0, path.lastIndexOf('/')) || "/sdcard";
                    tbody.innerHTML += `<tr style="cursor:pointer" onclick="loadFiles('${parentDir}')">
                        <td><span class="icon">🔙</span> ..</td><td>-</td><td></td></tr>`;
                }

                files.forEach(file => {
                    const isDir = file.type === "dir";
                    const icon = isDir ? "📁" : "📄";
                    const size = isDir ? "-" : formatBytes(file.size);
                    const fullPath = `${path === "/" ? "" : path}/${file.name}`;
                    
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td style="cursor:pointer" onclick="${isDir ? `loadFiles('${fullPath}')` : ''}">
                            <span class="icon">${icon}</span> ${file.name}
                        </td>
                        <td>${size}</td>
                        <td>
                            <button class="action-btn" title="Excluir" onclick="deleteFile('${fullPath}')">🗑️</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                tbody.innerHTML = "<tr><td colspan='3' style='color:red;'>Erro ao carregar arquivos. ESP32 offline?</td></tr>";
            }
        }

        async function deleteFile(path) {
            if(!confirm(`Tem certeza que deseja excluir:\n${path}?`)) return;
            await fetch(`/api/delete?path=${encodeURIComponent(path)}`, { method: 'POST' });
            loadFiles(currentPath);
        }

        async function createFolder() {
            const name = prompt("Nome da nova pasta:");
            if(!name) return;
            const path = `${currentPath === "/" ? "" : currentPath}/${name}`;
            await fetch(`/api/mkdir?path=${encodeURIComponent(path)}`, { method: 'POST' });
            loadFiles(currentPath);
        }

        // --- SISTEMA DE UPLOAD COM PROGRESSO (XHR para capturar %) ---
        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0]; // Simplificado para 1 arquivo por vez no exemplo
            const path = `${currentPath === "/" ? "" : currentPath}/${file.name}`;
            
            document.getElementById('upload-modal').style.display = 'flex';
            document.getElementById('upload-title').innerText = `Enviando ${file.name}...`;
            
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `/api/upload?path=${encodeURIComponent(path)}`, true);
            
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progress-fill').style.width = percent + '%';
                    document.getElementById('upload-status').innerText = percent + '%';
                }
            };
            
            xhr.onload = function() {
                document.getElementById('upload-modal').style.display = 'none';
                document.getElementById('progress-fill').style.width = '0%';
                loadFiles(currentPath);
            };
            
            xhr.send(file);
        }

        // --- DRAG AND DROP ---
        const dropZone = document.getElementById('drop-zone');
        window.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.display = 'block'; });
        dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            dropZone.style.display = 'none';
            handleFiles(e.dataTransfer.files);
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Inicia carregando o SD Card
        // loadFiles(currentPath); // Comentado para você poder abrir no PC e ver o visual sem dar erro de requisição!
    </script>
</body>
</html>
