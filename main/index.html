<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Watch OS - Arquivos</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #007BFF; --text: #ffffff; --text-muted: #888888; --border: #333333; --hover: #2a2a2a; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); }
        .header { background-color: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .header h2 { margin: 0; font-size: 1.2rem; }
        .toolbar { padding: 15px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button { background-color: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-secondary { background-color: var(--surface); border: 1px solid var(--border); }
        .path-display { font-family: monospace; color: var(--text-muted); flex-grow: 1; text-align: right; }
        .file-list { width: 100%; border-collapse: collapse; }
        .file-list th, .file-list td { text-align: left; padding: 12px 20px; border-bottom: 1px solid var(--border); }
        .file-list tr:hover { background-color: var(--hover); }
        .icon { font-size: 1.2rem; margin-right: 10px; }
        .action-btn { background: none; border: none; padding: 5px; cursor: pointer; font-size: 1.1rem; }
        .disabled { pointer-events: none; opacity: 0.5; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
        .progress-bar { width: 100%; background: var(--border); height: 10px; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>
    <div class="header">
        <h2>⌚ WatchOS File Manager</h2>
        <div>ESP32-S3 SD Card</div>
    </div>
    <div class="toolbar">
        <label>
            <input type="file" id="upload-input" style="display: none;" multiple onchange="uploadFiles()">
            <button onclick="document.getElementById('upload-input').click()">☁️ Enviar Arquivo</button>
        </label>
        <button class="btn-secondary" style="display: none;" onclick="createFolder()">📁 Nova Pasta</button>
        <button class="btn-secondary" onclick="updateView(currentPath)">🔄 Atualizar</button>
        <span class="path-display" id="subtitle">/sdcard</span>
    </div>
    <table class="file-list" id="filebrowser">
        <thead><tr><th>Nome</th><th>Tamanho</th><th>Ações</th></tr></thead>
        <tbody><tr><td colspan='3'>Carregando interface...</td></tr></tbody>
    </table>
    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <h3 id="status-title">Processando...</h3>
            <div class="progress-bar"><div class="progress-fill" id="status-fill"></div></div>
            <p id="status-text">Aguarde...</p>
        </div>
    </div>
    <script>
        let currentPath = '/sdcard';
        function $(selector) { return document.querySelector(selector); }
        function dirname(path) { return path.substring(0, path.lastIndexOf('/')) || '/sdcard'; }

        function deleteFile(path) {
            if (confirm('Excluir permanentemente:\n' + path + ' ?\n\nIsso apagará todos os arquivos dentro da pasta!')) {
                showModal("Deletando...", true);
                fetch(`/api/delete?path=${encodeURIComponent(path)}`, { method: 'POST' })
                    .then(() => { hideModal(); updateView(dirname(path)); });
            }
        }

        function renameFile(path) {
            let oldName = path.split('/').pop();
            let newName = prompt('Renomear "' + oldName + '" para:', oldName);
            if (newName && newName.trim() !== '' && newName !== oldName) {
                let newPath = dirname(path) + '/' + newName;
                showModal("Renomeando...", true);
                fetch(`/api/rename?old=${encodeURIComponent(path)}&new=${encodeURIComponent(newPath)}`, { method: 'POST' })
                    .then(() => { hideModal(); updateView(dirname(path)); });
            }
        }

        function createFolder() {
            let newFolder = prompt('Nome da nova pasta:', 'nova_pasta');
            if (newFolder && newFolder.trim() !== '') {
                showModal("Criando Pasta...", true);
                fetch(`/api/mkdir?path=${encodeURIComponent(currentPath + '/' + newFolder)}`, { method: 'POST' })
                    .then(() => { hideModal(); updateView(currentPath); });
            }
        }

        function downloadFile(path) { 
            window.open(`/api/download?path=${encodeURIComponent(path)}`, '_blank').focus(); 
        }

        function uploadFiles() {
            let files = $('#upload-input').files;
            if (files.length === 0) return;
            let file = files[0];
            let targetPath = currentPath + '/' + file.name;
            
            showModal(`Enviando ${file.name}...`, true);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', `/api/upload?path=${encodeURIComponent(targetPath)}`);
            xhr.addEventListener('loadstart', () => $('#filebrowser').classList.add('disabled'));
            xhr.addEventListener('load', function () { hideModal(); updateView(currentPath); });
            xhr.addEventListener('error', function () { hideModal(); alert('Falha ao enviar ' + file.name); });
            xhr.upload.addEventListener('progress', function (e) {
                if(e.lengthComputable) {
                    let pct = Math.floor(e.loaded/e.total * 100);
                    $('#status-fill').style.width = pct + '%';
                    $('#status-text').innerText = pct + '%';
                }
            });
            xhr.send(file);
            $('#upload-input').value = '';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateView(path) {
            fetch(`/api/list?dir=${encodeURIComponent(path)}`)
                .then(response => response.json())
                .then(data => {
                    let tbody = $('#filebrowser tbody');
                    tbody.innerHTML = '';
                    if (path !== "/sdcard" && path !== "/") {
                        tbody.innerHTML += `<tr style="cursor:pointer" onclick="updateView('${dirname(path)}')">
                            <td><span class="icon">🔙</span> ..</td><td>-</td><td></td></tr>`;
                    }
                    let files = data.files;
                    if (!files) {
                        tbody.innerHTML = "<tr><td colspan='3' style='color:red'>Pasta Invalida ou Corrompida</td></tr>";
                        return;
                    }
                    files.sort((a, b) => (a.name < b.name ? -1 : (a.name > b.name ? 1 : 0)));
                    files.sort((a, b) => (a.is_dir > b.is_dir ? -1 : (a.is_dir < b.is_dir ? 1 : 0)));
                    for (let f of files) {
                        let fullPath = path + '/' + f.name;
                        let icon = f.is_dir ? "📁" : "📄";
                        let size = f.is_dir ? "-" : formatBytes(f.size);
                        let clickAction = f.is_dir ? `updateView('${fullPath}')` : `downloadFile('${fullPath}')`;
                        let row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="cursor:pointer" onclick="${clickAction}"><span class="icon">${icon}</span> ${f.name}</td>
                            <td>${size}</td>
                            <td>
                                <button class="action-btn" title="Renomear" onclick="renameFile('${fullPath}')">✏️</button>
                                <button class="action-btn" title="Excluir" onclick="deleteFile('${fullPath}')">🗑️</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    }
                    $('#subtitle').innerText = path;
                    currentPath = path;
                }).catch(error => {
                    $('#filebrowser tbody').innerHTML = "<tr><td colspan='3' style='color:red;'>Erro ao carregar arquivos.</td></tr>";
                });
        }

        function showModal(title, isProgress) {
            $('#upload-modal').style.display = 'flex';
            $('#status-title').innerText = title;
            $('#status-fill').style.width = isProgress ? '0%' : '100%';
            $('#status-text').innerText = isProgress ? '0%' : 'Aguarde...';
        }
        function hideModal() { $('#upload-modal').style.display = 'none'; $('#filebrowser').classList.remove('disabled'); }
        setTimeout(() => { updateView('/sdcard'); }, 500);
    </script>
</body>
</html>
